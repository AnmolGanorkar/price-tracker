services:
  - type: web
    name: price-tracker-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: data/products.db
      - key: PYTHON_VERSION
        value: 3.9.0

  - type: background
    name: price-tracker-scheduler
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler/scheduler.py
    envVars:
      - key: DB_PATH
        value: data/products.db
